<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>〇〇旅｜旅行プラン提案</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#222}header{height:66px;background:#fff;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;padding:0 6%}.logo{font-size:24px;font-weight:800;color:#2867aa}.sw{display:flex;background:#edf1f5;padding:4px;border-radius:9px}.sw button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer}.sw .on{background:#fff;color:#2563a6;box-shadow:0 1px 5px #0002}
main{max-width:1100px;margin:25px auto;padding:0 18px}.hero{padding:27px 32px;border:1px solid #dce5ed;border-radius:16px;background:linear-gradient(120deg,#dfedfa,#fbfdff)}.hero h1{margin:0 0 8px}.hero p{margin:0;color:#596674}.grid{display:grid;grid-template-columns:1fr 450px;gap:23px;margin-top:22px}.info{background:#fff;border:1px solid #e1e5e9;border-radius:15px;padding:24px}.tips{background:#f4f7fa;padding:18px;border-radius:12px;margin-top:20px}
.chat{height:610px;background:#fff;border:1px solid #dce1e6;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 9px 28px #00000010}.head{padding:14px 16px;border-bottom:1px solid #e5e8ec;display:flex;align-items:center;gap:10px}.av,.mini{border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}.av{width:46px;height:46px}.mini{width:30px;height:30px;font-size:10px}.human{background:#f1ddd2;color:#76503f}.ai{background:#dfebfb;color:#2764a8}.name{font-weight:750}.role{font-size:12px;color:#78818b;margin-top:3px}
.msgs{flex:1;overflow:auto;padding:17px;background:#fafbfc}.row{display:flex;gap:8px;align-items:flex-end;margin:11px 0}.row.me{justify-content:flex-end}.bubble{max-width:80%;padding:10px 13px;border:1px solid #e0e4e8;background:#fff;border-radius:14px 14px 14px 4px;line-height:1.65;font-size:14px}.me .bubble{background:#e8f1ff;border-color:#d9e5f8;border-radius:14px 14px 4px 14px}
.input{padding:12px;border-top:1px solid #e4e7eb;display:flex;gap:9px}textarea{flex:1;height:61px;resize:none;border:1px solid #cbd2d9;border-radius:10px;padding:10px;font:inherit}.send{width:72px;border:0;border-radius:9px;background:#3475c5;color:#fff;font-weight:700}.send:disabled{background:#adb6c0}
.typing{display:flex;gap:5px;padding:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#8290a0;animation:b 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
.result{display:flex;gap:11px;width:330px;max-width:100%;background:#fff;border:1px solid #d9dee4;border-radius:12px;padding:10px;box-shadow:0 3px 10px #0000000b}.pic{width:104px;height:82px;border-radius:9px;background:linear-gradient(145deg,#9dc9e8 0 42%,#6fa66e 43% 62%,#e5eef5 63%);position:relative;overflow:hidden;flex:none}.pic:after{content:"♨";position:absolute;right:9px;bottom:7px;font-size:25px}.rtitle{font-weight:750;font-size:14px;margin:2px 0 5px}.rtext{font-size:12px;color:#66717d;line-height:1.5}.link{display:inline-block;margin-top:5px;color:#2769b1;font-size:12px;text-decoration:underline}
.overlay{position:fixed;inset:0;background:#1c273455;display:none;align-items:center;justify-content:center;z-index:30}.modal{width:550px;max-width:92%;background:#fff;border-radius:16px;padding:30px;box-shadow:0 25px 80px #0005}.opt{border:1px solid #cdd4db;border-radius:11px;padding:17px;margin:11px 0;cursor:pointer}.opt:hover{background:#f5f8fa}.small{font-size:12px;color:#7c858e}.locked{filter:blur(2px);opacity:.62;pointer-events:none}
@media(max-width:850px){
 body{background:#fff}
 header{height:54px;padding:0 14px;position:sticky;top:0;z-index:10}
 .logo{font-size:20px}
 .sw button{padding:6px 10px;font-size:12px}
 main{margin:0;padding:0;max-width:none}
 .hero{border:0;border-bottom:1px solid #e2e6ea;border-radius:0;padding:17px 16px}
 .hero h1{font-size:20px;margin-bottom:5px}
 .hero p{font-size:13px;line-height:1.55}
 .grid{display:block;margin:0}
 .info{display:none}
 .chat{height:calc(100dvh - 139px);min-height:520px;border:0;border-radius:0;box-shadow:none}
 .head{padding:10px 13px;background:#fff}
 .av{width:39px;height:39px;font-size:12px}
 .msgs{padding:13px 11px}
 .row{margin:9px 0;gap:6px}
 .mini{width:27px;height:27px;font-size:9px}
 .bubble{max-width:84%;font-size:14px;padding:9px 11px}
 .input{padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:#fff}
 textarea{height:52px;font-size:16px}
 .send{width:62px}
 .result{width:min(310px,calc(100vw - 64px))}
 .pic{width:88px;height:76px}
 .modal{width:calc(100% - 26px);padding:23px 18px;border-radius:15px}
 .modal h2{font-size:20px;margin-top:0}
 .opt{padding:15px 13px}
}
</style></head><body>
<header><div class="logo">〇〇旅</div><div class="sw"><button id="bh">Human</button><button id="ba">AI</button></div></header>
<main><section class="hero"><h1>あなたに合った旅行プランを探す</h1><p>ご希望を入力すると、あなたに合った旅行プランをご提案します。</p></section><div class="grid">
<section class="info"><h2>旅行プラン提案サービス</h2><p>旅行のご希望をお聞きし、あなたに合った旅行プランをお探しします。</p><div class="tips"><b>こんなことをお聞かせください</b><p>行ってみたい場所、興味のあること、同行者、旅行日数など</p></div></section>
<section class="chat"><div class="head"><div id="topav" class="av"></div><div><div id="nm" class="name"></div><div id="rl" class="role"></div></div></div><div id="msgs" class="msgs"></div><div class="input"><textarea id="txt" disabled placeholder="ご希望を入力してください"></textarea><button id="send" class="send" disabled>送信</button></div></section>
</div></main>
<div id="overlay" class="overlay"><div class="modal"><h2>キャッシュバックキャンペーン</h2><p>おすすめの旅行プランをご覧いただく前に、キャンペーンについてお伺いします。</p><p><b>本日中に旅行をご予約いただく場合、以下のいずれか一つをお選びいただけます。</b></p><div class="opt" data-v="now">○　<b>今すぐ1,000円</b>を受け取る</div><div class="opt" data-v="later">○　<b>1週間後に1,500円</b>を受け取る</div><p class="small">いずれか一つを選択してください。</p></div></div>
<script>
let cond="HUMAN",run=0, resultCard=null;const $=x=>document.getElementById(x),msgs=$("msgs"),txt=$("txt"),send=$("send");
const sleep=m=>new Promise(r=>setTimeout(r,m));
function add(t,h,me=false,type=false){let r=document.createElement("div");r.className="row"+(me?" me":"");if(!me){let a=document.createElement("div");a.className="mini "+(h?"human":"ai");a.textContent=h?"田中":"AI";r.appendChild(a)}let b=document.createElement("div");b.className="bubble";if(type)b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';else b.textContent=t;r.appendChild(b);msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;return r}
async function say(t,id,h){let q=add("",h,false,true);await sleep(1000);if(id!==run)return false;q.remove();add(t,h);return true}
function result(h){let r=document.createElement("div");r.className="row";let a=document.createElement("div");a.className="mini "+(h?"human":"ai");a.textContent=h?"田中":"AI";let wrap=document.createElement("div");wrap.innerHTML='<div style="font-size:14px;margin-bottom:7px">おすすめの旅行プランが見つかりました。</div><div class="result locked" id="card"><div class="pic"></div><div><div class="rtitle">おすすめ旅行プラン</div><div class="rtext">ご希望に合った旅行先をご提案します。</div><span class="link">詳細を見る ＞</span></div></div>';r.append(a,wrap);msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;resultCard=wrap.querySelector(".result")}
function setup(){run++;let id=run,h=cond==="HUMAN";msgs.innerHTML="";txt.value="";txt.disabled=true;send.disabled=true;$("overlay").style.display="none";$("topav").className="av "+(h?"human":"ai");$("topav").textContent=h?"田中":"AI";$("nm").textContent=h?"担当者：田中":"AIアシスタント：旅";$("rl").textContent=h?"旅行会社のスタッフが対応しています":"AIによる自動応答サービスです";$("bh").className=h?"on":"";$("ba").className=h?"":"on";start(id,h)}
async function start(id,h){await sleep(600);if(id!==run)return;if(!await say(h?"こんにちは。〇〇旅カスタマーサポートセンターへお問い合わせいただき、ありがとうございます。":"こんにちは。〇〇旅自動カスタマーサポートセンターへお問い合わせいただき、ありがとうございます。",id,h))return;await sleep(1400);if(!await say(h?"担当の田中です。":"アシスタントの旅です。",id,h))return;await sleep(1500);if(!await say("お客様に合った旅行プランをお探しですね。行ってみたい場所や興味のあること、同行者、旅行日数など、ご希望を自由に入力してください。",id,h))return;txt.disabled=false;send.disabled=false;txt.focus()}
$("bh").onclick=()=>{cond="HUMAN";setup()};$("ba").onclick=()=>{cond="AI";setup()};
send.onclick=async()=>{let v=txt.value.trim();if(!v)return;let id=run,h=cond==="HUMAN";add(v,h,true);txt.value="";txt.disabled=true;send.disabled=true;await sleep(1200);if(!await say("ありがとうございます。",id,h))return;await sleep(1400);if(!await say("ご希望に合った旅行プランをお調べしますので、少々お待ちください。",id,h))return;await sleep(450);let w=add("",h,false,true);await sleep(20000);if(id!==run)return;w.remove();result(h);await sleep(650);$("overlay").style.display="flex"};
txt.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send.click()}});
document.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{localStorage.setItem("choice",o.dataset.v);$("overlay").style.display="none";if(resultCard){resultCard.classList.remove("locked");resultCard.querySelector(".rtitle").textContent="温泉と自然を楽しむ3日間";resultCard.querySelector(".rtext").textContent="自然、温泉、グルメを楽しめるおすすめの旅行プランです。";}});
setup();
</script></body></html>
